<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Free — CampusConnect</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="../index.html" class="logo">Campus<span>Connect</span></a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-card" style="max-width:500px">
    <div class="auth-logo">Campus<span>Connect</span></div>
    <div class="auth-title">Join for free</div>
    <div class="auth-sub">Create your student account in 30 seconds</div>

    <form id="registerForm">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group" style="margin:0">
          <label class="form-label">First Name</label>
          <input type="text" class="form-input" placeholder="Sneha" required />
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-input" placeholder="Chauhan" required />
        </div>
      </div>
      <br/>
      <div class="form-group">
        <label class="form-label">College Email</label>
        <input type="email" class="form-input" placeholder="your@college.ac.in" required />
        <div style="font-size:12px;color:var(--text3);margin-top:6px">Use your .ac.in or .edu email to verify your college</div>
      </div>
      <div class="form-group">
        <label class="form-label">College / University</label>
        <select class="form-select">
          <option value="">Select your college</option>
          <option>NIT Warangal</option>
          <option>BITS Pilani</option>
          <option>VIT Vellore</option>
          <option>IIT Hyderabad</option>
          <option>IIIT Hyderabad</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Year of Study</label>
        <select class="form-select">
          <option value="">Select year</option>
          <option>1st Year</option>
          <option>2nd Year</option>
          <option>3rd Year</option>
          <option>4th Year</option>
          <option>Postgraduate</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" class="form-input" placeholder="••••••••" required />
      </div>
      <div style="font-size:13px;color:var(--text3);margin-bottom:20px">
        By joining, you agree to our <a href="#" style="color:var(--purple)">Terms</a> and <a href="#" style="color:var(--purple)">Privacy Policy</a>.
      </div>
      <button type="submit" class="btn-primary btn-full">Create Account →</button>
    </form>

    <div class="auth-switch">
      Already have an account? <a href="login.html">Sign in →</a>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
</body>
</html>
